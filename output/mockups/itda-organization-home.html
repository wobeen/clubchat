<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITDA · 내 소속</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--background,#fff);color:var(--foreground,#222);font-family:var(--font-sans,Arial),sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #555;outline-offset:3px}.note{font-size:12px;color:var(--muted-foreground,#666);margin:0 0 12px}
.mock{background:#fff;color:#202020;border:1px solid #aaa;border-radius:22px;overflow:hidden;min-height:720px;box-shadow:0 7px 24px #0000000d}.mock button{color:#222}.glass{background:linear-gradient(145deg,#fff 20%,#f5f5f580 80%,#fff);border:1px solid #a1a1a1;border-radius:16px;box-shadow:inset 0 1px 1px #fff,inset 0 -2px 3px #0000000b,0 3px 0 #00000012,0 7px 16px #00000008}.top{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:19px 28px;border-bottom:1px solid #ddd}.brand{font-weight:850;letter-spacing:-1px;font-size:23px}.brand small{font-size:11px;letter-spacing:2px;margin-left:8px}.account{display:flex;align-items:center;gap:10px;font-size:12px}.circle{display:grid;place-items:center;width:34px;height:34px;border:1px solid #aaa;border-radius:50%;background:#fff;font-weight:700}.content{padding:38px;max-width:1120px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;color:#666;font-weight:700}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}h2{font-size:18px;letter-spacing:-.4px}p{line-height:1.65}.muted{color:#666;font-size:13px}.intro{display:flex;justify-content:space-between;align-items:end;gap:16px}.plain{border:1px solid #bbb;background:white;border-radius:10px;padding:10px 14px;font-size:13px}.strong{font-weight:750;border-color:#555;box-shadow:0 2px 0 #ccc}.tools{display:flex;justify-content:space-between;align-items:center;margin:28px 0 18px;gap:16px}.search{border:1px solid #bbb;background:#fff;border-radius:11px;padding:12px 14px;width:280px;max-width:100%;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.org{text-align:left;padding:22px;display:flex;flex-direction:column;min-height:280px;transition:transform .15s}.org:hover{transform:translateY(-3px);border-color:#333}.orghead{display:flex;justify-content:space-between;align-items:start;gap:10px}.symbol{width:46px;height:46px;border:1px solid #888;border-radius:15px;display:grid;place-items:center;font-size:19px;font-weight:750;background:#fff}.tag{border:1px solid #bbb;border-radius:20px;padding:5px 9px;font-size:11px;background:#fff}.org h2{margin:20px 0 2px}.org .muted{margin:4px 0 18px}.orgfooter{border-top:1px solid #ddd;margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.count{font-size:13px;font-weight:700}.next{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding:22px 0;margin-top:30px;gap:20px}.next a{color:#333;font-size:13px}.hint{border-top:1px solid #ddd;padding:18px 28px;font-size:12px;color:#666}.scope{display:flex;align-items:center;gap:10px}.scope strong{font-size:14px}.back{border:0;background:transparent;padding:6px;font-size:12px;text-decoration:underline;color:#555}.workspace{display:grid;grid-template-columns:170px 290px minmax(0,1fr);min-height:660px}.nav{border-right:1px solid #ddd;padding:22px 12px;display:flex;flex-direction:column;gap:9px}.nav button{border:1px solid transparent;background:#fff;padding:12px;text-align:left;border-radius:10px;font-size:13px}.nav button.active{border-color:#888;font-weight:750;box-shadow:0 2px 0 #ddd}.nav .bottom{margin-top:auto;font-size:11px;padding:12px;color:#666}.list{border-right:1px solid #ddd;padding:22px 14px}.listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.listhead h2{margin:0}.filters{display:flex;gap:7px;margin:18px 0}.filters button{font-size:11px;padding:6px 9px;border:1px solid #ccc;border-radius:20px;background:white}.filters button.active{border-color:#333;font-weight:700}.capsule{width:100%;padding:16px;margin-bottom:12px;text-align:left;min-height:112px}.capsule strong{display:block;font-size:13px;margin-bottom:8px}.capsule p{font-size:12px;color:#666;margin:0 0 10px}.capsule.selected{border-color:#333;box-shadow:inset 3px 0 #333,0 3px 0 #ddd}.detail{min-width:0;padding:22px}.detail h2{margin:0 0 5px;font-size:20px}.relation{margin:20px 0;padding:15px}.relation .steps{display:flex;justify-content:space-between;font-size:11px;margin:16px 0;color:#666}.action{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px}.tabs{display:flex;border-bottom:1px solid #ccc;gap:22px;margin-bottom:20px}.tabs button{border:0;background:white;padding:12px 0;font-size:12px}.tabs .active{border-bottom:3px solid #333;font-weight:700}.bubble{padding:14px 16px;max-width:88%;margin:10px 0 20px;font-size:13px}.messagehead{font-size:11px;color:#666}.own{margin-left:auto}.composer{margin-top:24px;padding:14px;display:flex;gap:12px}.composer input{border:0;background:transparent;min-width:0;width:100%;font-size:13px}.panel{padding:24px;grid-column:2/-1}.members{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.member{padding:22px}.empty{padding:48px;text-align:center;color:#666}.mobile-title{display:none}.toast{padding:12px;margin:16px 0;border:1px solid #bbb;border-radius:10px;font-size:12px}.hidden{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:1fr}.content{padding:24px}.intro{align-items:start;flex-direction:column}.org{min-height:220px}.workspace{grid-template-columns:1fr}.nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid #ddd;padding:10px}.nav .bottom{display:none}.list{border-right:0;border-bottom:1px solid #ddd}.detail{padding:18px}.panel{grid-column:auto;padding:20px}.members{grid-template-columns:1fr 1fr}.top{padding:16px;flex-wrap:wrap}.account span:not(.circle){display:none}.scope{flex-wrap:wrap}.tools{align-items:start;flex-direction:column;gap:8px}h1{font-size:26px}.next{flex-direction:column}.mock{min-height:660px}.capsule{min-height:90px}.hint{padding:16px}.action{flex-wrap:wrap}}
</style></head><body>
<p class="note">UX 시안 · 소속 카드를 눌러 동아리 화면으로 들어가고, ‘소속 바꾸기’로 돌아와 보세요. 데이터는 연습용입니다.</p>
<div class="mock" id="app"><header class="top"><div class="brand">잇다<small>ITDA</small></div><div class="account"><span>김민수 님</span><span class="circle">민</span></div></header><main class="content"><div class="intro"><div><div class="eyebrow">MY SPACES</div><h1>어디서 이야기를 이어갈까요?</h1><p class="muted">내가 속한 동아리와 모임을 선택하세요.<br>캡슐, 멤버, 일정은 선택한 소속 안에서 관리해요.</p></div><button class="plain strong" data-action="join">＋ 소속 참여하기</button></div><div class="tools"><strong style="font-size:14px">내 소속 <span class="muted">3</span></strong><input class="search" id="search" placeholder="내 소속 검색" aria-label="내 소속 검색"></div><div class="grid" id="org-grid"><button class="org glass" data-action="enter" data-id="sol"><div class="orghead"><span class="symbol">솔</span><span class="tag">운영진</span></div><h2>솔크크 동아리</h2><p class="muted">대학교 동아리 · 멤버 24명</p><p style="font-size:13px;margin:0 0 20px">축제 준비를 함께 이어가고 있어요.</p><div class="orgfooter"><span><span class="count">내 확인 2건</span><br><span class="muted" style="font-size:11px">진행 중인 캡슐 6개</span></span><span>들어가기 ↗</span></div></button><button class="org glass" data-action="enter" data-id="read"><div class="orghead"><span class="symbol">P</span><span class="tag">멤버</span></div><h2>페이지 독서 모임</h2><p class="muted">취미 모임 · 멤버 8명</p><p style="font-size:13px;margin:0 0 20px">다음 달 함께 읽을 책을 골라요.</p><div class="orgfooter"><span><span class="count">내 확인 1건</span><br><span class="muted" style="font-size:11px">진행 중인 캡슐 2개</span></span><span>들어가기 ↗</span></div></button><button class="org glass" data-action="enter" data-id="project"><div class="orghead"><span class="symbol">G</span><span class="tag">팀장</span></div><h2>졸업 프로젝트 팀</h2><p class="muted">프로젝트 · 멤버 5명</p><p style="font-size:13px;margin:0 0 20px">발표 전 마지막 점검을 준비해요.</p><div class="orgfooter"><span>새로운 확인 요청 없음<br><span class="muted" style="font-size:11px">진행 중인 캡슐 3개</span></span><span>들어가기 ↗</span></div></button></div><div class="next"><span class="muted">초대받은 모임이 있나요? 초대 코드로 참여할 수 있어요.</span><button class="back" data-action="new">새 소속 만들기 →</button></div><div id="notice" role="status"></div></main><footer class="hint">개인 홈에서는 내 소속을 고릅니다. 동아리의 멤버·캡슐 원문은 해당 소속 안에서만 보여요.</footer></div>
<script>
const orgs=[
{id:'sol',name:'솔크크 동아리',symbol:'솔',kind:'대학교 동아리',role:'운영진',members:24,active:6,pending:2,latest:'축제 준비를 함께 이어가고 있어요.',capsules:[['축제 부스 준비 회의','메뉴 가격 검토 결과가 합류했어요.','내 확인 필요'],['신입 부원 환영회','환영회 장소와 진행 순서를 정해요.','논의 중'],['11월 운영진 모임','지난 회의 미결 안건 2개를 이어가요.','예약됨']],people:['김민수','이지은','박서준','최하린','정도윤','김지우']},
{id:'read',name:'페이지 독서 모임',symbol:'P',kind:'취미 모임',role:'멤버',members:8,active:2,pending:1,latest:'다음 달 함께 읽을 책을 골라요.',capsules:[['12월 도서 선정','후보 세 권 중 함께 읽을 책을 정해요.','내 확인 필요'],['이번 주 독서 나눔','각자의 인상 깊은 문장을 모아요.','논의 중']],people:['김민수','유서연','임도현','안수빈']},
{id:'project',name:'졸업 프로젝트 팀',symbol:'G',kind:'프로젝트',role:'팀장',members:5,active:3,pending:0,latest:'발표 전 마지막 점검을 준비해요.',capsules:[['최종 발표 준비','발표 자료 초안을 함께 검토해요.','논의 중'],['사용성 테스트 회고','개선 항목과 다음 할 일을 정리했어요.','확정됨']],people:['김민수','이서현','정유진','강현우','최지호']}
];let selected=null,section='capsules',capsule=0,filter='all',detailTab='chat';const app=document.getElementById('app');
function top(){return `<header class="top"><div class="brand">잇다<small>ITDA</small></div>${selected?`<div class="scope"><span class="symbol" style="width:30px;height:30px;font-size:13px">${selected.symbol}</span><strong>${selected.name}</strong><button class="back" data-action="home">소속 바꾸기 ↗</button></div>`:''}<div class="account"><span>김민수 님</span><span class="circle">민</span></div></header>`}
function home(){selected=null;app.innerHTML=top()+`<main class="content"><div class="intro"><div><div class="eyebrow">MY SPACES</div><h1>어디서 이야기를 이어갈까요?</h1><p class="muted">내가 속한 동아리와 모임을 선택하세요.<br>캡슐, 멤버, 일정은 선택한 소속 안에서 관리해요.</p></div><button class="plain strong" data-action="join">＋ 소속 참여하기</button></div><div class="tools"><strong style="font-size:14px">내 소속 <span class="muted">3</span></strong><input class="search" id="search" placeholder="내 소속 검색" aria-label="내 소속 검색"></div><div class="grid" id="org-grid">${cards('')}</div><div class="next"><span class="muted">초대받은 모임이 있나요? 초대 코드로 참여할 수 있어요.</span><button class="back" data-action="new">새 소속 만들기 →</button></div><div id="notice" role="status"></div></main><footer class="hint">개인 홈에서는 내 소속을 고릅니다. 동아리의 멤버·캡슐 원문은 해당 소속 안에서만 보여요.</footer>`}
function cards(query){const items=orgs.filter(o=>o.name.includes(query));return items.length?items.map(o=>`<button class="org glass" data-action="enter" data-id="${o.id}"><div class="orghead"><span class="symbol">${o.symbol}</span><span class="tag">${o.role}</span></div><h2>${o.name}</h2><p class="muted">${o.kind} · 멤버 ${o.members}명</p><p style="font-size:13px;margin:0 0 20px">${o.latest}</p><div class="orgfooter"><span>${o.pending?`<span class="count">내 확인 ${o.pending}건</span>`:'새로운 확인 요청 없음'}<br><span class="muted" style="font-size:11px">진행 중인 캡슐 ${o.active}개</span></span><span>들어가기 ↗</span></div></button>`).join(''):'<p class="muted">검색한 소속이 없어요.</p>'}
function workspace(){const o=selected;app.innerHTML=top()+`<div class="workspace"><nav class="nav" aria-label="현재 소속 메뉴">${[['capsules','◉','캡슐'],['members','♧','멤버'],['calendar','▦','일정'],['records','▤','확정 기록']].map(([id,icon,title])=>`<button data-action="section" data-id="${id}" class="${section===id?'active':''}">${icon}　${title}</button>`).join('')}<div class="bottom">${o.name}<br><br>이 소속 안의 내용만 표시됩니다.</div></nav>${section==='capsules'?capsuleView():otherView()}</div>`}
function capsuleView(){const o=selected,c=o.capsules[capsule];return `<aside class="list"><div class="listhead"><h2>캡슐</h2><button class="plain" data-action="sample">＋ 새 캡슐</button></div><p class="muted">${o.name}의 이야기와 결정</p><div class="filters"><button data-action="filter" data-id="all" class="${filter==='all'?'active':''}">전체</button><button data-action="filter" data-id="review" class="${filter==='review'?'active':''}">내 확인 필요</button></div>${o.capsules.map((x,i)=>filter==='review'&&x[2]!=='내 확인 필요'?'':`<button class="capsule glass ${i===capsule?'selected':''}" data-action="capsule" data-id="${i}"><strong>${x[0]}</strong><p>${x[1]}</p><span class="tag">${x[2]}</span></button>`).join('')}<div id="notice" role="status"></div></aside><main class="detail"><h2>${c[0]}</h2><span class="muted">${o.name} · 참여 멤버끼리 나누는 캡슐</span><div class="relation glass"><span class="tag">현재 캡슐</span><div class="steps"><span>✓ 논의</span><span>→ 결론 합류</span><strong>→ 공동 확인</strong><span>→ 다음 회의</span></div><div class="action"><span>${c[2]==='내 확인 필요'?'내 확인을 기다리는 결론이 있어요.':'대화에서 결정할 내용을 모아보세요.'}</span><button class="plain strong" data-action="detail" data-id="minutes">결론 살펴보기</button></div></div><nav class="tabs">${[['chat','대화'],['minutes','결론'],['events','확정 일정']].map(([id,label])=>`<button class="${detailTab===id?'active':''}" data-action="detail" data-id="${id}">${label}</button>`).join('')}</nav>${detailTab==='chat'?`<div class="messagehead">${o.people[1]}　오후 6:30</div><div class="bubble glass">${c[1]}</div><div class="messagehead" style="text-align:right">나　오후 6:32</div><div class="bubble glass own">좋아요. 담당과 다음 할 일도 함께 정리할게요.</div><div class="bubble glass"><strong>하위 캡슐 · 결론 합류</strong><p style="margin-bottom:0">세부 검토가 끝났어요. 확인된 결론을 함께 살펴보세요.</p></div><form class="composer glass" id="composer"><input placeholder="이 캡슐에 메시지 남기기" aria-label="메시지"><button class="plain" type="submit">↑</button></form>`:detailTab==='minutes'?`<div class="glass" style="padding:20px"><span class="tag">검토본 · 버전 2</span><h2>함께 정한 내용</h2><p>${c[1]}</p><p class="muted">근거를 확인하고 이 버전에 확인을 남겨요.</p><button class="plain strong" data-action="confirm">이 버전 확인</button><div id="detail-notice" role="status"></div></div>`:'<div class="glass" style="padding:24px"><h2>다음 만남</h2><p>11월 19일 · 오후 7시</p><p class="muted">이 캡슐에서 확정한 일정만 표시해요.</p></div>'}</main>`}
function otherView(){const o=selected;if(section==='members')return `<main class="panel"><div class="eyebrow">${o.name}</div><h1>함께하는 멤버</h1><p class="muted">${o.name}에 속한 멤버 ${o.members}명 · 시안에서는 일부만 표시</p><div class="members">${o.people.map((n,i)=>`<div class="member glass"><span class="circle">${n.slice(-1)}</span><h2>${n}</h2><span class="muted">${i===0?o.role:'멤버'}</span></div>`).join('')}</div></main>`;return `<main class="panel"><div class="eyebrow">${o.name}</div><h1>${section==='calendar'?'이 소속의 일정':'이 소속의 확정 기록'}</h1><p class="muted">${o.name}의 ${section==='calendar'?'확정된 만남을 모았어요.':'공동 확인을 마친 결론을 모았어요.'}</p><div class="glass" style="padding:24px;margin-top:24px"><h2>${o.capsules[0][0]}</h2><p>${section==='calendar'?'11월 19일 · 오후 7시 · 온라인':o.capsules[0][1]}</p><button class="plain" data-action="section" data-id="capsules">관련 캡슐 열기 →</button></div></main>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='enter'){selected=orgs.find(o=>o.id===b.dataset.id);section='capsules';capsule=0;detailTab='chat';filter='all';workspace()}else if(a==='home')home();else if(a==='section'){section=b.dataset.id;workspace()}else if(a==='capsule'){capsule=Number(b.dataset.id);workspace()}else if(a==='filter'){filter=b.dataset.id;workspace()}else if(a==='detail'){detailTab=b.dataset.id;workspace()}else if(a==='confirm'){document.getElementById('detail-notice').innerHTML='<p class="toast">이 버전에 내 확인을 남겼어요. 다른 멤버의 확인을 기다려요.</p>'}else{const notice=document.getElementById('notice');if(notice)notice.innerHTML=`<p class="toast">${a==='join'?'초대 코드 입력 → 참여할 소속 정보 확인 → 가입 순서로 이어집니다.':a==='new'?'새 소속 이름 · 소개 · 가입 방식을 설정하는 단계로 이어집니다.':'새 캡슐은 현재 선택한 '+selected.name+' 안에 만들어집니다.'}</p>`}});
document.addEventListener('input',e=>{if(e.target.id==='search')document.getElementById('org-grid').innerHTML=cards(e.target.value.trim())});document.addEventListener('submit',e=>{if(e.target.id==='composer'){e.preventDefault();const input=e.target.querySelector('input');if(!input.value.trim())return;const bubble=document.createElement('div');bubble.className='bubble glass own';bubble.textContent=input.value;e.target.before(bubble);input.value=''}});home();
</script></body></html>
