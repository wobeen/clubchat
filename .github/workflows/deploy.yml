name: Deploy (Lightsail)
on:
  workflow_run:
    workflows: ['ITDA checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: '배포할 커밋/브랜치 (기본: main)'
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/wobeen/clubchat-api

jobs:
  deploy:
    # 자동 실행은 main 푸시로 돈 test 워크플로가 성공했을 때만.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: Set image tag
        id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$LIGHTSAIL_HOST" ] && [ -n "$LIGHTSAIL_SSH_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LIGHTSAIL_HOST / LIGHTSAIL_SSH_KEY 비밀값이 없어 서버 배포 단계를 건너뜁니다."
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static files
        run: |
          node deploy/build-static.mjs deploy/dist/public
          grep -q 'name="itda-api" content="on"' deploy/dist/public/index.html
          tar -C deploy -czf itda-bundle.tgz docker-compose.yml Caddyfile dist/public

      - name: Upload bundle
        if: steps.secrets.outputs.present == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: itda-bundle.tgz
          target: /opt/itda

      - name: Sync static files and restart stack
        if: steps.secrets.outputs.present == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/itda
            tar xzf itda-bundle.tgz
            rm -rf public && mv dist/public public && rmdir dist && rm itda-bundle.tgz
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # 현재 태그 기록(롤백 참고용). .env 의 TAG 줄만 갱신한다.
            grep -v '^TAG=' .env > .env.new || true
            echo "TAG=$TAG" >> .env.new && mv .env.new .env
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
