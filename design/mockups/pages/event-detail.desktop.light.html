<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>event-detail desktop light</title>
<link rel="stylesheet" href="../styles.css"/>
</head>
<body><div class="stage"><div class="app"><aside class="rail">
    <div class="logo">C</div>
    <div class="rail-scroll">
      <button class="rail-btn active" aria-label="프레임">프</button><button class="rail-btn" aria-label="알고리듬">알</button><button class="rail-btn" aria-label="잔향">잔<span class="dot">1</span></button>
      <button class="rail-add" aria-label="초대 코드로 가입"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <button class="rail-btn rail-me" aria-label="프로필">하</button>
  </aside><aside class="side">
    <div class="side-head"><div><div class="side-title">프레임</div><div class="side-sub">방 4 · 멤버 12</div></div></div>
    <div class="side-body">
      <div class="section-label">참여 중</div>
      <button class="nav-item unread">
        <span class="hash">#</span><span class="nav-name grow">공지</span><span class="count">1</span>
      </button><button class="nav-item unread">
        <span class="hash">#</span><span class="nav-name grow">자유</span><span class="count">4</span>
      </button><button class="nav-item active">
        <span class="hash">#</span><span class="nav-name grow">주말출사</span>
      </button>
      <div class="section-label">입장 필요</div>
      <button class="nav-item"><span class="hash"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="nav-text grow"><span class="nav-name">장비</span><span class="nav-sub">비밀번호</span></span><span class="link">입장</span></button>
    </div>
  </aside><section class="main"><header class="main-head"><div><div class="crumb">프레임 / 주말출사</div><h1>일정</h1></div><div class="head-actions"></div></header><div class="main-body"><div class="card"><button class="event">
    <span class="datechip"><b>15</b><span>11월</span></span>
    <span class="grow"><span class="event-title">남산 야경 출사</span><span class="event-meta">토 17:00 · 남산서울타워</span></span>
    <span class="pill">참석 6</span>
  </button><button class="event">
    <span class="datechip"><b>18</b><span>11월</span></span>
    <span class="grow"><span class="event-title">정기 회의</span><span class="event-meta">화 19:00 · 학생회관 302</span></span>
    <span class="pill neutral">미정 4</span>
  </button><button class="event">
    <span class="datechip"><b>22</b><span>11월</span></span>
    <span class="grow"><span class="event-title">포트폴리오 리뷰</span><span class="event-meta">토 14:00 · 온라인</span></span>
    <span class="pill">참석 3</span>
  </button></div></div></section></div><div class="scrim"><div class="dialog wide"><div class="dialog-head"><h1 class="grow">일정</h1><button class="icon-btn" aria-label="닫기"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="dialog-body" style="display:flex;flex-direction:column;gap:14px">
    <div><h1 style="font-size:20px">남산 야경 출사</h1>
      <div class="split-meta"><span><b>11월 15일 토</b> 17:00–20:00</span><span>남산서울타워</span></div>
      <p>일몰 직후 타워 쪽에서 모입니다. 삼각대는 공용 2대, 나머지는 개인 지참.</p>
    </div>
    <div><div class="field-label">참석</div><div class="rsvp"><button class="on">참석 6</button><button>미정 2</button><button>불참 1</button></div></div>
    <div class="attendees"><div class="member"><span class="av sm">하은</span><span class="grow">김하은</span><span class="pill">참석</span></div><div class="member"><span class="av sm">서준</span><span class="grow">박서준</span><span class="pill">참석</span></div><div class="member"><span class="av sm">수민</span><span class="grow">이수민</span><span class="pill neutral">미정</span></div><div class="member"><span class="av sm">도윤</span><span class="grow">최도윤</span><span class="pill">참석</span></div></div>
    <div class="pair"><button class="btn btn-secondary btn-block">수정</button><button class="btn btn-danger btn-block">삭제</button></div>
  </div></div></div></div></body>
</html>
