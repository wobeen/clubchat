<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>join-code desktop light</title>
<link rel="stylesheet" href="../styles.css"/>
</head>
<body><div class="stage"><div class="app"><aside class="rail">
    <div class="logo">C</div>
    <div class="rail-scroll">
      <button class="rail-btn" aria-label="프레임">프<span class="dot">3</span></button><button class="rail-btn" aria-label="알고리듬">알</button><button class="rail-btn" aria-label="잔향">잔<span class="dot">1</span></button>
      <button class="rail-add" aria-label="초대 코드로 가입"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <button class="rail-btn rail-me av-a" aria-label="프로필">하</button>
  </aside><aside class="side">
    <div class="side-head"><div><div class="side-title">동아리</div><div class="side-sub">김하은</div></div></div>
    <div class="side-body">
      <div class="section-label">가입함 3</div>
      <button class="nav-item unread">
        <span class="mark">프</span>
        <span class="nav-text"><span class="nav-name">프레임</span><span class="nav-sub">사진 · 12명</span></span>
        <span class="count">3</span>
      </button><button class="nav-item">
        <span class="mark">알</span>
        <span class="nav-text"><span class="nav-name">알고리듬</span><span class="nav-sub">스터디 · 8명</span></span>
        
      </button><button class="nav-item unread">
        <span class="mark">잔</span>
        <span class="nav-text"><span class="nav-name">잔향</span><span class="nav-sub">밴드 · 6명</span></span>
        <span class="count">1</span>
      </button>
    </div>
    <div class="side-foot">
      <button class="btn btn-primary btn-block"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> 동아리 만들기</button>
      <button class="btn btn-secondary btn-block">초대 코드로 가입</button>
    </div>
  </aside><section class="main"><div class="empty"><h2>동아리를 선택하세요</h2><p>또는 초대 코드로 바로 들어올 수 있습니다.</p></div></section></div><div class="scrim"><div class="dialog"><div class="dialog-head"><h1 class="grow">초대 코드로 가입</h1><button class="icon-btn" aria-label="닫기"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="dialog-body"><p class="muted" style="margin-bottom:12px">동아리 관리자에게 받은 8자리 코드입니다.</p>
    <label class="form-gap" style="gap:0"><span class="field-label">초대 코드</span><div class="input lg">A3F1 9C2B</div><span class="help">대소문자는 구분하지 않습니다.</span></label>
    <button class="btn btn-primary btn-block" style="margin-top:14px">가입하기</button></div></div></div></div></body>
</html>
