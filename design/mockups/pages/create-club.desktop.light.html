<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>create-club desktop light</title>
<link rel="stylesheet" href="../styles.css"/>
</head>
<body><div class="stage"><div class="app"><aside class="rail">
    <div class="logo">C</div>
    <div class="rail-scroll">
      <button class="rail-btn" aria-label="프레임">프<span class="dot">3</span></button><button class="rail-btn" aria-label="알고리듬">알</button><button class="rail-btn" aria-label="잔향">잔<span class="dot">1</span></button>
      <button class="rail-add" aria-label="초대 코드로 가입"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <button class="rail-btn rail-me av-a" aria-label="프로필">하</button>
  </aside><aside class="side">
    <div class="side-head"><div><div class="side-title">동아리</div><div class="side-sub">김하은</div></div></div>
    <div class="side-body"><div class="empty" style="padding:24px 12px"><h2 style="font-size:14px">아직 동아리가 없어요</h2><p>만들거나 초대 코드로 들어올 수 있어요.</p></div></div>
    <div class="side-foot">
      <button class="btn btn-primary btn-block"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> 동아리 만들기</button>
      <button class="btn btn-secondary btn-block">초대 코드로 가입</button>
    </div>
  </aside><section class="main"><div class="empty"><h2>동아리를 선택하세요</h2></div></section></div><div class="scrim"><div class="dialog"><div class="dialog-head"><h1 class="grow">동아리 만들기</h1><button class="icon-btn" aria-label="닫기"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="dialog-body"><label class="form-gap" style="gap:0"><span class="field-label">동아리 이름</span><div class="input">프레임</div><span class="help">만든 사람이 방장이 됩니다. 나중에 바꿀 수 있어요.</span></label>
    <button class="btn btn-primary btn-block" style="margin-top:16px">만들기</button></div></div></div></div></body>
</html>
