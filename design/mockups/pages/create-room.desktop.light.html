<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>create-room desktop light</title>
<link rel="stylesheet" href="../styles.css"/>
</head>
<body><div class="stage"><div class="app"><aside class="rail">
    <div class="logo">C</div>
    <div class="rail-scroll">
      <button class="rail-btn active" aria-label="프레임">프</button><button class="rail-btn" aria-label="알고리듬">알</button><button class="rail-btn" aria-label="잔향">잔<span class="dot">1</span></button>
      <button class="rail-add" aria-label="초대 코드로 가입"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <button class="rail-btn rail-me" aria-label="프로필">하</button>
  </aside><aside class="side">
    <div class="side-head"><div><div class="side-title">동아리</div><div class="side-sub">김하은</div></div></div>
    <div class="side-body">
      <div class="section-label">가입함 3</div>
      <button class="nav-item active unread">
        <span class="mark">프</span>
        <span class="nav-text"><span class="nav-name">프레임</span><span class="nav-sub">사진 · 12명</span></span>
        <span class="count">3</span>
      </button><button class="nav-item">
        <span class="mark">알</span>
        <span class="nav-text"><span class="nav-name">알고리듬</span><span class="nav-sub">스터디 · 8명</span></span>
        
      </button><button class="nav-item unread">
        <span class="mark">잔</span>
        <span class="nav-text"><span class="nav-name">잔향</span><span class="nav-sub">밴드 · 6명</span></span>
        <span class="count">1</span>
      </button>
    </div>
    <div class="side-foot">
      <button class="btn btn-primary btn-block"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> 동아리 만들기</button>
      <button class="btn btn-secondary btn-block">초대 코드로 가입</button>
    </div>
  </aside><section class="main"><header class="main-head"><div><div class="crumb">내 동아리</div><h1>프레임</h1></div><div class="head-actions"><button class="btn btn-ghost">멤버 12</button><button class="btn btn-secondary">초대 코드</button><button class="btn btn-secondary">관리</button></div></header>
  <div class="main-body"><div class="stack">
    <div class="card club-hero">
      <span class="mark">프</span>
      <div class="grow"><div class="event-title" style="font-size:16px">프레임</div><div class="meta-line">사진 · 방장 · 2024년에 만들었어요</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>위키</h2><span class="link">편집</span></div>
      <article class="wiki">
    <h1>프레임</h1>
    <p>주 1회 밖에서 사진을 찍는 동아리입니다. 삼각대는 공용 2대이고, 촬영본은 화요일까지 자유 방에 올립니다.</p>
    
  </article>
    </div>
    <div class="card">
      <div class="card-head"><h2>다가오는 일정</h2><span class="link">전체 보기</span></div>
      <button class="event">
    <span class="datechip"><b>15</b><span>11월</span></span>
    <span class="grow"><span class="event-title">남산 야경 출사</span><span class="event-meta">토 17:00 · 남산서울타워</span></span>
    <span class="pill">참석 6</span>
  </button><button class="event">
    <span class="datechip"><b>18</b><span>11월</span></span>
    <span class="grow"><span class="event-title">정기 회의</span><span class="event-meta">화 19:00 · 학생회관 302</span></span>
    <span class="pill neutral">미정 4</span>
  </button><button class="event">
    <span class="datechip"><b>22</b><span>11월</span></span>
    <span class="grow"><span class="event-title">포트폴리오 리뷰</span><span class="event-meta">토 14:00 · 온라인</span></span>
    <span class="pill">참석 3</span>
  </button>
    </div>
    <div class="card" style="padding-bottom:8px">
      <div class="card-head"><h2>방</h2><span class="link">방 만들기</span></div>
      <div class="room-row"><span class="hash">#</span><span class="grow"><span class="event-title">공지</span><span class="event-meta">공지 · 안 읽음 1</span></span><span class="count">1</span></div>
  <div class="room-row"><span class="hash">#</span><span class="grow"><span class="event-title">자유</span><span class="event-meta">최근 메시지 14:21</span></span><span class="count">4</span></div>
  <div class="room-row on"><span class="hash">#</span><span class="grow"><span class="event-title">주말출사</span><span class="event-meta">참여 중 · 8명</span></span></div>
  <div class="room-row"><span class="hash"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span class="grow"><span class="event-title">장비</span><span class="event-meta">비밀번호가 필요해요</span></span><span class="link">입장</span></div>
    </div>
  </div></div></section></div><div class="scrim"><div class="dialog"><div class="dialog-head"><h1 class="grow">방 만들기</h1><button class="icon-btn" aria-label="닫기"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="dialog-body"><div class="form-gap">
    <label class="form-gap" style="gap:0"><span class="field-label">방 이름</span><div class="input">주말출사</div></label>
    <div class="checkline"><div><div class="strong" style="font-size:14px">비밀번호</div><div class="help" style="margin:0">켠 방만 코드를 묻습니다.</div></div><div class="switch"><i></i></div></div>
    <label class="form-gap" style="gap:0"><span class="field-label">비밀번호</span><div class="input">••••••</div><span class="help">4자 이상. 원문은 저장하지 않습니다.</span></label>
    <button class="btn btn-primary btn-block">방 만들기</button>
  </div></div></div></div></div></body>
</html>
